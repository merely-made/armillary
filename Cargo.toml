[workspace]
resolver = "2"
members = [
    "crates/armillary",
    "crates/apparatus-core",
    "crates/djinn",
    "crates/ostiary",
    "crates/peer-facts",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/armillary"
authors = [
    "Mark AB (markik)",
]

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch."https://github.com/merely-made/armillary.git".armillary]
path = "crates/armillary"
