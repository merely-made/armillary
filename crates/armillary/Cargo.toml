[package]
name = "armillary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mere's host-neutral actor-kernel runtime: a !Send host-kernel boundary and a Send actor harness for the constellation of subsystems around the kernel."

[lib]
path = "src/lib.rs"

[dependencies]
# Host-neutral instrumentation facade: the substrate emits actor-lifecycle spans/events; the host
# installs the subscriber (meerkat's Apparatus bridge), so this stays host-neutral like `Wake`.
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
