[package]
rust-version = "1.97.1"
name = "armillary"
version = "0.1.1"
edition = "2024"
description = "A host-neutral actor-kernel runtime: a !Send host-kernel boundary, a Send actor harness (thread-per-actor or pooled), generation counters for backpressure, and a growable reusing worker pool. GPUI's kernel/actor discipline made structural."
repository = "https://github.com/merely-made/armillary"
keywords = [
    "actor",
    "concurrency",
    "threading",
    "runtime",
    "gpui",
]
categories = [
    "concurrency",
    "rust-patterns",
]

[package.license]
workspace = true

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = "0.3"
