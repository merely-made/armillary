[package]
name = "ostiary"
version = "0.0.1"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The application door's contract: hello, admission types, framing, envelopes and the native client."

[features]
default = []
native = ["dep:tokio", "dep:base64", "dep:rand_core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1"

[target.'cfg(all(not(target_arch = "wasm32"), any(unix, windows)))'.dependencies]
tokio = { version = "1", features = ["io-util", "net", "time"], optional = true }
base64 = { version = "0.22", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
