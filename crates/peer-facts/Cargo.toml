[package]
name = "peer-facts"
version = "0.0.1"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What the operating system says about the other end of a local connection: Unix credentials, Windows token and image, macOS code signature."

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
